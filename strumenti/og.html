<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Immagine og:image (1200×630)</title>
<!-- Pagina usata solo da strumenti/og-immagine.mjs per creare img/og-vetrina.jpg -->
<style>
  @font-face { font-family: "Archivo"; src: url("../fonts/archivo-variabile.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: grid; grid-template-columns: 1fr 520px; align-items: center; gap: 56px;
    padding: 0 72px 0 80px; box-sizing: border-box;
    background: #ac252b; color: #fff; font-family: "Archivo", sans-serif;
  }
  .nome { margin: 0 0 20px; font-size: 26px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 92px; font-weight: 800; font-stretch: 72%; line-height: 0.92; text-transform: uppercase; }
  .dove { margin: 32px 0 0; font-size: 28px; font-weight: 600; }
  figure { margin: 0; padding: 12px; background: #fff; transform: rotate(2deg); box-shadow: 0 18px 36px -18px rgb(0 0 0 / 0.5); }
  /* 496×512: la foto originale (686×708) viene solo rimpicciolita */
  img { display: block; width: 496px; height: 512px; object-fit: cover; }
</style>
</head>
<body>
  <div>
    <p class="nome">Quartin</p>
    <h1>Chiacchiere da bar in Vanchiglia</h1>
    <p class="dove">Via Santa Giulia 21/D, Torino</p>
  </div>
  <figure><img src="../img/vetrina-logo.webp" alt=""></figure>
</body>
</html>
